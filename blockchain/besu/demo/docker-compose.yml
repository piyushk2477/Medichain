# ── Medichain SINGLE-NODE Besu (demo) ────────────────────────────────────────
# One QBFT validator. Fast (~2s blocks), free gas, real Ethereum-compatible chain.
# Run on a $5 VPS (or locally + a tunnel) for product-owner demos.
#
#   docker compose up -d  &&  docker compose logs -f
#
# Files needed beside this compose file:
#   ./config/genesis.json   — generated in step 1 below
#   ./config/key            — the single node's private key (networkFiles/keys/0x.../key)
# -----------------------------------------------------------------------------
services:
  besu:
    image: hyperledger/besu:24.12.0
    container_name: medichain-besu-demo
    restart: unless-stopped
    ports:
      - "8545:8545/tcp"     # JSON-RPC — put nginx/TLS in front for the app
      - "30303:30303/tcp"
      - "30303:30303/udp"
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/key:/config/key:ro
      - besu-demo-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --data-path=/data
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      - --rpc-http-cors-origins=all
      - --host-allowlist=*

volumes:
  besu-demo-data:
