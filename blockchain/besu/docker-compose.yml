# ── Medichain private Besu node (QBFT) ───────────────────────────────────────
# One copy of this file runs on EACH of the 4 VPS nodes.
# Per-node values come from the .env file next to this compose file.
#
#   On each VPS:  docker compose up -d   (then: docker compose logs -f)
#
# Required files mounted into the container (place beside this compose file):
#   ./config/genesis.json   — SAME genesis on every node (from Phase 1)
#   ./config/key            — THIS node's private key  (nodeXXXX/key from Phase 1)
# -----------------------------------------------------------------------------
services:
  besu:
    image: hyperledger/besu:24.12.0
    container_name: medichain-besu
    restart: unless-stopped
    ports:
      - "30303:30303/tcp"   # P2P  — must be reachable by the other 3 nodes
      - "30303:30303/udp"
      - "8545:8545/tcp"     # JSON-RPC — keep behind nginx/firewall (see README)
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/key:/config/key:ro
      - besu-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --data-path=/data
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      - --rpc-http-cors-origins=${RPC_CORS_ORIGINS:-all}
      - --host-allowlist=*
      - --p2p-host=${P2P_HOST}
      - --p2p-port=30303
      - --bootnodes=${BOOTNODES}

volumes:
  besu-data:
